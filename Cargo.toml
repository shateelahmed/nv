[package]
name = "nv"
version = "0.1.0"
edition = "2024"
description = "Configure environment variables across multiple microservices from the terminal."
license = "MIT"
readme = "README.md"
keywords = ["env", "dotenv", "configmap", "secrets", "tui"]
categories = ["command-line-utilities"]

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
base64 = "0.23.0"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
dialoguer = "0.12.0"
hex = "0.4.3"
nucleo-matcher = "0.3.1"
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
rand = "0.10.2"
rand_chacha = "0.9.0"
regex = "1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
sha2 = "0.10.8"
similar = "3.1.1"
thiserror = "2.0.19"

[dev-dependencies]
assert_fs = "1.1.4"
predicates = "3.1.4"
tempfile = "3.27.0"
